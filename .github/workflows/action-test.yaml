name: Action

# Runs this repository's action against the test fixtures, the way users run
# it, to prove the composite action installs and reports correctly.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Healthy project passes
        uses: ./
        with:
          project: test/fixtures/modern_kts
          args: --flutter-version 3.47.2 --java-version 17

      - name: Broken project fails
        id: broken
        continue-on-error: true
        uses: ./
        with:
          project: test/fixtures/broken_kts
          args: --flutter-version 3.47.2 --java-version 17

      - name: Expect the broken project to have failed
        if: steps.broken.outcome != 'failure'
        run: |
          echo "::error::The action passed on a broken project."
          exit 1
