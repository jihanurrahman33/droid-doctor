name: Update compatibility data

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Refresh data from Flutter, Gradle, Google Maven and Maven Central
        run: dart run tool/update_data.dart --report "$RUNNER_TEMP/report.md"
      - name: Verify
        run: |
          dart analyze --fatal-infos
          dart test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-update
          title: Update compatibility data
          commit-message: Update compatibility data
          body-path: ${{ runner.temp }}/report.md
          add-paths: |
            data/matrix.json
            lib/src/data/bundled_matrix.g.dart
          delete-branch: true
