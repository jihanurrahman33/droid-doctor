version: 0.3.0
repository: https://github.com/jihanurrahman33/droid-doctor
issue_tracker: https://github.com/jihanurrahman33/droid-doctor/issues
topics: [android, gradle, flutter, kotlin, cli]

environment:
  sdk: ^3.6.0

executables:
  droid_doctor:
dependencies:
  args: ^2.7.0
  path: ^1.9.1
dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0
